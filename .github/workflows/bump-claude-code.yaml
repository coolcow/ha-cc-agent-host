name: Bump Claude Code

on:
  schedule:
    # Monthly: users get newer releases through the update entity; the image only catches up
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Dispatch CI for the new branch: pushes and pull requests made with GITHUB_TOKEN start no workflows
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: tools/bump-claude-code.sh
      - name: Open pull request when the version changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          v="$(grep -oP '^ARG CLAUDE_CODE_VERSION=\K.*' cc_agent_host/Dockerfile)"
          branch="bump/claude-code-$v"
          git ls-remote --exit-code origin "$branch" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build: bump Claude Code to $v"
          git push -u origin "$branch"
          gh pr create --fill --title "build: bump Claude Code to $v"
          gh workflow run ci.yaml --ref "$branch"
