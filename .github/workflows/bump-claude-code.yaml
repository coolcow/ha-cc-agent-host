name: Bump Claude Code

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/bump-claude-code.sh
      - name: Open pull request when the version changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          v="$(grep -oP '^ARG CLAUDE_CODE_VERSION=\K.*' cc_agent_host/Dockerfile)"
          branch="bump/claude-code-$v"
          git ls-remote --exit-code origin "$branch" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump Claude Code to $v"
          git push -u origin "$branch"
          gh pr create --fill --title "Bump Claude Code to $v"
