name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run (incl. aarch64 image) catches upstream breakage: base image, Claude Code, Home Assistant
  schedule:
    - cron: "41 2 * * *"
  # Also used by bump-claude-code.yaml: pull requests opened with GITHUB_TOKEN do not trigger workflows
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    # Decides whether the add-on image changed; the aarch64 build only runs then (private repo: minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      addon: ${{ steps.diff.outputs.addon }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          addon=true
          if [[ $EVENT == pull_request || $EVENT == push ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --quiet "$BASE" HEAD -- cc_agent_host tests/addon .github/workflows/ci.yaml && addon=false
          fi
          echo "addon=$addon" | tee -a "$GITHUB_OUTPUT"

  version:
    # Pull requests: a changed add-on / integration must raise its version (own job: does not block the image)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/agent/ci-step "Version check" scripts/agent/version-check "$BASE"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/agent/ci-step "Lint" scripts/agent/check lint
      - name: Upload agent logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-lint
          path: .agent-logs/
          retention-days: 7
          include-hidden-files: true

  api:
    # Job API tests and repository consistency tests (both plain pytest, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/agent/ci-step "Job API tests" scripts/agent/check repo api
      - name: Upload agent logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-api
          path: .agent-logs/
          retention-days: 7
          include-hidden-files: true

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt
      - run: pip install -r tests/integration/requirements.txt
      - run: scripts/agent/ci-step "Integration tests" scripts/agent/test integration
      - name: Upload agent logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-integration
          path: .agent-logs/
          retention-days: 7
          include-hidden-files: true

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master

  hacs:
    # HACS reads hacs.json and manifest.json anonymously from raw.githubusercontent.com and needs a
    # description, topics and brand assets: impossible for a private repository. Runs once it is public.
    # Visibility via the API: scheduled runs carry no repository object in the event payload.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" | tee -a "$GITHUB_OUTPUT"
      - if: ${{ steps.visibility.outputs.private == 'false' }}
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main
        with:
          category: integration

  image:
    needs: [changes, lint, api]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Skip aarch64 (add-on unchanged)
        id: skip
        if: ${{ matrix.arch == 'aarch64' && needs.changes.outputs.addon != 'true' }}
        run: echo "add-on unchanged, aarch64 build skipped (runs nightly)"
      - if: ${{ steps.skip.outcome == 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build, image and isolation tests
        if: ${{ steps.skip.outcome == 'skipped' }}
        run: scripts/agent/ci-step "Image (${{ matrix.arch }})" scripts/agent/check image
      - name: Upload agent logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-logs-image-${{ matrix.arch }}
          path: .agent-logs/
          retention-days: 7
          include-hidden-files: true

  gate:
    # Single stable check for branch protection: fails if any job failed or was cancelled
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, version, lint, api, integration, hassfest, hacs, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [[ $r == success || $r == skipped ]] || { echo "::error::a required job ended with: $r"; exit 1; }
          done
