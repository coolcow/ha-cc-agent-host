name: CC Agent Host
version: "0.1.0"
slug: cc_agent_host
description: Runs the official Claude Code CLI inside Home Assistant with your own subscription
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# Web terminal only through Home Assistant ingress (nginx admits the ingress gateway only)
ingress: true
ingress_port: 8099
panel_icon: mdi:console
panel_title: CC Agent Host
panel_admin: true

map:
  - type: homeassistant_config
    read_only: false
  - type: addon_config
    read_only: false

options:
  remote_control: false
schema:
  remote_control: bool
