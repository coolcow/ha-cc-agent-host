name: CC Agent Host
version: "0.5.0"
slug: cc_agent_host
description: Runs the official Claude Code CLI inside Home Assistant with your own subscription
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# Web terminal only through Home Assistant ingress (nginx admits the ingress gateway only)
ingress: true
ingress_port: 8099
panel_icon: mdi:console
panel_title: CC Agent Host
panel_admin: true

# Mounted below /srv/ha (mode 700): the job user cc_agent cannot reach any of it
map:
  - type: homeassistant_config
    read_only: false
    path: /srv/ha/config
  - type: addon_config
    read_only: false
    path: /srv/ha/addon_config

# Context data for jobs (core log, states); never passed to the job user
hassio_api: true
homeassistant_api: true

# Announces the job API (host, port, token) to the companion integration
discovery:
  - cc_agent_host

options:
  remote_control: false
  usage_api: false
schema:
  remote_control: bool
  usage_api: bool
