# Read-only job with the Home Assistant core log since the last successful run (journal, survives
# restarts) and the deduplicated system log (errors and warnings), e.g. for a daily digest.
description: Summarize Home Assistant errors and warnings
model: sonnet
max_turns: 10
timeout: 300
tools: [Read, Grep, Glob]
context:
  - ha_log:
      levels: [WARNING, ERROR, CRITICAL]
  - ha_system_log:
      levels: [ERROR, CRITICAL, WARNING]
