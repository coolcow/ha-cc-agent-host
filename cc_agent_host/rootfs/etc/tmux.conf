set -g mouse on
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[CC Agent Host] "


# Tappable tabs (works on phones, no Ctrl key needed): "Terminal" = session cc, "Remote Control" =
# session rc (server mode, only while the option is on). Clicks elsewhere keep the default behavior.
set -g status-right "#[range=user|cc]#{?#{==:#{session_name},cc},#[reverse],} Terminal #[norange default] #[range=user|rc]#{?#{==:#{session_name},rc},#[reverse],} Remote Control #[norange default]"
set -g status-right-length 60
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},rc}" "switch-client -t =rc" { if -F "#{==:#{mouse_status_range},cc}" "switch-client -t =cc" "select-window -t =" }
